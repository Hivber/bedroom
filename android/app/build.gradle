plugins { id 'com.android.application' }

android {
    namespace 'com.hivber.backrooms'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hivber.backrooms'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O2 -Wall -Wextra' }
        }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
}
